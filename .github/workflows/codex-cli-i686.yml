name: Codex CLI i686 musl

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/cargo-target
      CARGO_HOME: ${{ github.workspace }}/.codex-local/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.codex-local/rustup
      V8_FROM_SOURCE: "1"
      GN_ARGS: "use_glib=false"

    steps:
      - name: Check out CodexPad
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve pinned upstreams
        shell: bash
        run: |
          set -euo pipefail
          revision="$(jq -r '.codex.revision' Dependencies/upstreams.json)"
          toolchain="$(jq -r '.codex.rustToolchain' Dependencies/upstreams.json)"
          target="$(jq -r '.codex.target' Dependencies/upstreams.json)"
          zig="$(jq -r '.tooling.zig' Dependencies/upstreams.json)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$target" == "i686-unknown-linux-musl" ]]
          echo "CODEX_REVISION=$revision" >> "$GITHUB_ENV"
          echo "RUST_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "CODEX_TARGET=$target" >> "$GITHUB_ENV"
          echo "ZIG_VERSION=$zig" >> "$GITHUB_ENV"

      - name: Fetch pinned Codex source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/codex
          git -C upstream/codex init
          git -C upstream/codex remote add origin https://github.com/openai/codex.git
          git -C upstream/codex fetch --depth=1 origin "$CODEX_REVISION"
          git -C upstream/codex checkout --detach FETCH_HEAD
          test "$(git -C upstream/codex rev-parse HEAD)" = "$CODEX_REVISION"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN" \
                --target "$CODEX_TARGET"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install cargo-zigbuild
        shell: bash
        run: cargo install cargo-zigbuild --locked

      - name: Prepare Alpine i686 OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/alpine-openssl"
          cd "$GITHUB_WORKSPACE/alpine-openssl"
          base='https://dl-cdn.alpinelinux.org/alpine/v3.19/main/x86'
          curl --fail --location --retry 5 -o openssl-dev.apk "$base/openssl-dev-3.1.8-r1.apk"
          curl --fail --location --retry 5 -o openssl-libs-static.apk "$base/openssl-libs-static-3.1.8-r1.apk"
          tar -xzf openssl-dev.apk
          tar -xzf openssl-libs-static.apk
          test -f usr/include/openssl/ssl.h
          test -f usr/lib/libssl.a
          test -f usr/lib/libcrypto.a
          echo "OPENSSL_DIR=$GITHUB_WORKSPACE/alpine-openssl/usr" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB_DIR=$GITHUB_WORKSPACE/alpine-openssl/usr/lib" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=$GITHUB_WORKSPACE/alpine-openssl/usr/include" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/alpine-openssl/usr/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Inspect Codex workspace
        working-directory: upstream/codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > "$GITHUB_WORKSPACE/cargo-metadata.json"
          jq -r '.packages[] | select(.targets[]?.name == "codex") | .name' "$GITHUB_WORKSPACE/cargo-metadata.json"

      - name: Prepare i686 BLAKE3 workaround
        working-directory: upstream/codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --target "$CODEX_TARGET"
          blake3_src="$(find "$CARGO_HOME/registry/src" -maxdepth 3 -type d -name 'blake3-1.8.2' -print -quit)"
          test -n "$blake3_src"
          rm -rf "$GITHUB_WORKSPACE/blake3-patched"
          cp -a "$blake3_src" "$GITHUB_WORKSPACE/blake3-patched"
          sed -i 's/^default = \["std"\]$/default = ["std", "pure"]/' "$GITHUB_WORKSPACE/blake3-patched/Cargo.toml"
          grep -F 'default = ["std", "pure"]' "$GITHUB_WORKSPACE/blake3-patched/Cargo.toml"

      - name: Prepare V8 ICU data
        working-directory: upstream/codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          v8_src="$(find "$CARGO_HOME/registry/src" -maxdepth 3 -type d -name 'v8-149.2.0' -print -quit)"
          test -n "$v8_src"
          icu_dat="$v8_src/third_party/icu/common/icudtl.dat"
          if [[ ! -f "$icu_dat" ]]; then
            echo "icudtl.dat is missing; downloading deno_core_icudata 0.77.0"
            tmpdir="$(mktemp -d)"
            trap 'rm -rf "$tmpdir"' EXIT
            curl --fail --location --retry 5 \
              -o "$tmpdir/deno_core_icudata.crate" \
              'https://crates.io/api/v1/crates/deno_core_icudata/0.77.0/download'
            mkdir -p "$tmpdir/pkg"
            tar -xzf "$tmpdir/deno_core_icudata.crate" -C "$tmpdir/pkg"
            icu_source="$(find "$tmpdir/pkg" -type f -path '*/src/icudtl.dat' -print -quit)"
            test -n "$icu_source"
            mkdir -p "$(dirname "$icu_dat")"
            cp "$icu_source" "$icu_dat"
          fi
          test -s "$icu_dat"
          ls -lh "$icu_dat"

      - name: Cross-compile Codex CLI
        working-directory: upstream/codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo zigbuild --release --target "$CODEX_TARGET" --bin codex \
            --config "patch.crates-io.blake3.path='$GITHUB_WORKSPACE/blake3-patched'"

      - name: Inspect and package CLI
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/$CODEX_TARGET/release/codex"
          test -x "$binary"
          file "$binary" | tee artifacts/codex.file.txt
          sha256sum "$binary" | tee artifacts/codex.sha256
          mkdir -p artifacts/codex-i686-musl
          install -m 0755 "$binary" artifacts/codex-i686-musl/codex
          cp artifacts/codex.file.txt artifacts/codex.sha256 artifacts/codex-i686-musl/
          tar -C artifacts -czf artifacts/codex-i686-musl.tar.gz codex-i686-musl

      - name: Upload Codex CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a0 # v7.0.1
        with:
          name: codex-i686-musl
          path: artifacts/codex-i686-musl.tar.gz
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
